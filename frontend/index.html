<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sankara Nigeria Limited - Premium Agricultural Machinery and Mechanization Solutions." />
    <title>Sankara Nigeria Limited | Premium Machinery Solutions</title>
    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #050b1e 0%, #0a1931 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      .splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .splash-container {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-gear {
        position: absolute;
        width: 100%;
        height: 100%;
        animation: spin 8s linear infinite;
        opacity: 0.15;
        filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.3));
      }
      .splash-tractor {
        position: absolute;
        width: 80px;
        height: 80px;
        color: #ffffff;
        z-index: 10;
        filter: drop-shadow(0 0 20px rgba(0, 210, 255, 0.5));
        animation: float-tractor 3s ease-in-out infinite;
      }
      .splash-brand {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .brand-subtitle {
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 6px;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        animation: pulse-text 2.5s ease-in-out infinite;
      }
      .loading-bar {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }
      .loading-progress {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #00d2ff);
        border-radius: 10px;
        animation: loading-fill 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: left;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes float-tractor {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.04); }
      }
      @keyframes pulse-text {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      @keyframes loading-fill {
        0% { transform: scaleX(0); }
        50% { transform: scaleX(0.65); }
        100% { transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-container">
        <!-- Rotating Gear SVG -->
        <svg class="splash-gear" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer rim and teeth of the gear -->
          <path d="M50 25C36.19 25 25 36.19 25 50C25 63.81 36.19 75 50 75C63.81 75 75 63.81 75 50C75 36.19 63.81 25 50 25ZM50 67C40.61 67 33 59.39 33 50C33 40.61 40.61 33 50 33C59.39 33 67 40.61 67 50C67 59.39 59.39 67 50 67Z" fill="url(#gear-gradient)" />
          <rect x="46" y="12" width="8" height="15" rx="2" fill="url(#gear-gradient)" />
          <rect x="46" y="73" width="8" height="15" rx="2" fill="url(#gear-gradient)" />
          <rect x="12" y="46" width="15" height="8" rx="2" fill="url(#gear-gradient)" />
          <rect x="73" y="46" width="15" height="8" rx="2" fill="url(#gear-gradient)" />
          <rect x="22" y="22" width="8" height="15" rx="2" transform="rotate(45 22 22)" fill="url(#gear-gradient)" />
          <rect x="70" y="70" width="8" height="15" rx="2" transform="rotate(45 70 70)" fill="url(#gear-gradient)" />
          <rect x="22" y="78" width="8" height="15" rx="2" transform="rotate(-45 22 78)" fill="url(#gear-gradient)" />
          <rect x="70" y="30" width="8" height="15" rx="2" transform="rotate(-45 70 30)" fill="url(#gear-gradient)" />
          
          <defs>
            <linearGradient id="gear-gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
              <stop stop-color="#3b82f6" />
              <stop offset="1" stop-color="#00d2ff" />
            </linearGradient>
          </defs>
        </svg>

        <!-- Clean Tractor Vector SVG -->
        <svg class="splash-tractor" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
          <circle cx="6" cy="18" r="4" />
          <circle cx="18" cy="19" r="2.5" />
          <path d="M6 14h12l-1.5-6h-6.5L8 14Z" />
          <path d="M10 8V5h3v3" />
          <path d="M8 8V6h3.5" />
          <path d="M16 8V4h1" />
        </svg>
      </div>

      <div class="splash-brand">
        <span class="brand-subtitle">SANKARA NIGERIA LIMITED</span>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
