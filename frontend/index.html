<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Sankara Nigeria Limited - Premium Agricultural Machinery and Mechanization Solutions." />
    <title>Sankara Nigeria Limited | Premium Machinery Solutions</title>
    <style>
      .splash-screen {
        position: fixed;
        inset: 0;
        background: linear-gradient(135deg, #050b1e 0%, #0a1931 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        z-index: 9999;
        transition: opacity 0.6s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.6s;
        overflow: hidden;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
      }
      .splash-screen.fade-out {
        opacity: 0;
        visibility: hidden;
      }
      .splash-container {
        position: relative;
        width: 180px;
        height: 180px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .splash-gear {
        position: absolute;
        width: 100%;
        height: 100%;
        animation: spin 8s linear infinite;
        opacity: 0.15;
        filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.3));
      }
      .splash-tractor {
        position: absolute;
        width: 120px;
        height: 120px;
        z-index: 10;
        animation: float-tractor 3s ease-in-out infinite;
      }
      .splash-brand {
        margin-top: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
      }
      .brand-subtitle {
        font-size: 0.8rem;
        font-weight: 800;
        letter-spacing: 6px;
        color: rgba(255, 255, 255, 0.6);
        text-transform: uppercase;
        animation: pulse-text 2.5s ease-in-out infinite;
      }
      .loading-bar {
        width: 140px;
        height: 3px;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 10px;
        overflow: hidden;
        position: relative;
      }
      .loading-progress {
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, #3b82f6, #00d2ff);
        border-radius: 10px;
        animation: loading-fill 2s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        transform-origin: left;
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes float-tractor {
        0%, 100% { transform: translateY(0) scale(1); }
        50% { transform: translateY(-6px) scale(1.04); }
      }
      @keyframes pulse-text {
        0%, 100% { opacity: 0.5; }
        50% { opacity: 0.9; }
      }
      @keyframes loading-fill {
        0% { transform: scaleX(0); }
        50% { transform: scaleX(0.65); }
        100% { transform: scaleX(1); }
      }
    </style>
  </head>
  <body>
    <!-- Splash Screen -->
    <div id="splash-screen" class="splash-screen">
      <div class="splash-container">
        <!-- Rotating Gear SVG -->
        <svg class="splash-gear" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <!-- Outer rim and teeth of the gear -->
          <path d="M50 25C36.19 25 25 36.19 25 50C25 63.81 36.19 75 50 75C63.81 75 75 63.81 75 50C75 36.19 63.81 25 50 25ZM50 67C40.61 67 33 59.39 33 50C33 40.61 40.61 33 50 33C59.39 33 67 40.61 67 50C67 59.39 59.39 67 50 67Z" fill="url(#gear-gradient)" />
          <rect x="46" y="12" width="8" height="15" rx="2" fill="url(#gear-gradient)" />
          <rect x="46" y="73" width="8" height="15" rx="2" fill="url(#gear-gradient)" />
          <rect x="12" y="46" width="15" height="8" rx="2" fill="url(#gear-gradient)" />
          <rect x="73" y="46" width="15" height="8" rx="2" fill="url(#gear-gradient)" />
          <rect x="22" y="22" width="8" height="15" rx="2" transform="rotate(45 22 22)" fill="url(#gear-gradient)" />
          <rect x="70" y="70" width="8" height="15" rx="2" transform="rotate(45 70 70)" fill="url(#gear-gradient)" />
          <rect x="22" y="78" width="8" height="15" rx="2" transform="rotate(-45 22 78)" fill="url(#gear-gradient)" />
          <rect x="70" y="30" width="8" height="15" rx="2" transform="rotate(-45 70 30)" fill="url(#gear-gradient)" />
          
          <defs>
            <linearGradient id="gear-gradient" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
              <stop stop-color="#3b82f6" />
              <stop offset="1" stop-color="#00d2ff" />
            </linearGradient>
          </defs>
        </svg>

        <!-- High-Fidelity Blueprint Tractor SVG -->
        <svg class="splash-tractor" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <!-- Gradients -->
            <linearGradient id="body-gradient" x1="0" y1="0" x2="1" y2="1">
              <stop offset="0%" stop-color="#3b82f6" />
              <stop offset="100%" stop-color="#00d2ff" />
            </linearGradient>
            <linearGradient id="wheel-gradient" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#1e293b" />
              <stop offset="100%" stop-color="#0f172a" />
            </linearGradient>
            <linearGradient id="glow-gradient" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#00d2ff" stop-opacity="0.8" />
              <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.0" />
            </linearGradient>
            
            <!-- Glow filter -->
            <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
              <feGaussianBlur stdDeviation="2.5" result="blur" />
              <feComposite in="SourceGraphic" in2="blur" operator="over" />
            </filter>
          </defs>

          <!-- Ground Shadow -->
          <ellipse cx="50" cy="84" rx="30" ry="4" fill="#00d2ff" opacity="0.2" filter="url(#glow)" />

          <!-- Rear Wheel (Big, detailed) -->
          <g class="rear-wheel">
            <!-- Outer tire -->
            <circle cx="32" cy="64" r="18" fill="url(#wheel-gradient)" stroke="#00d2ff" stroke-width="1.5" />
            <!-- Treads -->
            <g stroke="#00d2ff" stroke-width="1.2" opacity="0.6">
              <line x1="32" y1="46" x2="32" y2="49" />
              <line x1="32" y1="79" x2="32" y2="82" />
              <line x1="14" y1="64" x2="17" y2="64" />
              <line x1="47" y1="64" x2="50" y2="64" />
              <line x1="19" y1="51" x2="22" y2="54" />
              <line x1="45" y1="77" x2="42" y2="74" />
              <line x1="45" y1="51" x2="42" y2="54" />
              <line x1="19" y1="77" x2="22" y2="74" />
            </g>
            <!-- Inner Hub -->
            <circle cx="32" cy="64" r="8" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5" />
            <circle cx="32" cy="64" r="3.5" fill="#00d2ff" />
          </g>

          <!-- Front Wheel (Small, detailed) -->
          <g class="front-wheel">
            <circle cx="76" cy="70" r="11" fill="url(#wheel-gradient)" stroke="#00d2ff" stroke-width="1.5" />
            <!-- Hub -->
            <circle cx="76" cy="70" r="4.5" fill="#0f172a" stroke="#00d2ff" stroke-width="1.5" />
            <circle cx="76" cy="70" r="1.8" fill="#00d2ff" />
          </g>

          <!-- Rear Mudguard / Fender -->
          <path d="M14 64 C14 49, 27 41, 43 45 L41 49 C28 46, 19 52, 19 64 Z" fill="url(#body-gradient)" opacity="0.8" stroke="#00d2ff" stroke-width="1" />

          <!-- Main Body / Engine Hood -->
          <path d="M41 48 L74 48 L76 58 L76 70 L60 70 L41 58 Z" fill="url(#body-gradient)" stroke="#00d2ff" stroke-width="1.5" />
          <!-- Engine Hood Details (Grills) -->
          <g stroke="#050b1e" stroke-width="1.2" opacity="0.6">
            <line x1="62" y1="53" x2="70" y2="53" />
            <line x1="60" y1="57" x2="70" y2="57" />
            <line x1="58" y1="61" x2="70" y2="61" />
          </g>
          <!-- Brand stripe/highlight -->
          <path d="M43 50 L73 50 L74 51.5 L43 51.5 Z" fill="#ffffff" opacity="0.9" />

          <!-- Cabin / ROPS (Canopy support frame) -->
          <!-- Pillars -->
          <line x1="33" y1="48" x2="36" y2="24" stroke="#00d2ff" stroke-width="2.2" />
          <line x1="48" y1="48" x2="48" y2="24" stroke="#00d2ff" stroke-width="1.8" />
          <line x1="56" y1="48" x2="56" y2="24" stroke="#00d2ff" stroke-width="1.5" />
          <!-- Roof / Canopy -->
          <path d="M31 24 L59 23 L57 19 L29 20 Z" fill="url(#body-gradient)" stroke="#00d2ff" stroke-width="1.5" />
          <!-- Windshield reflection -->
          <path d="M49 26 L55 26 L55 38 L49 38 Z" fill="#00d2ff" opacity="0.15" />

          <!-- Exhaust Pipe -->
          <path d="M66 48 L66 26 L69 24" stroke="#00d2ff" stroke-width="1.8" stroke-linecap="round" />
          <!-- Exhaust Heat/Smoke Glow -->
          <circle cx="69" cy="19" r="1.5" fill="#00d2ff" opacity="0.8" filter="url(#glow)" />
          <circle cx="72" cy="14" r="2.5" fill="#00d2ff" opacity="0.4" filter="url(#glow)" />

          <!-- Front Lights (Glowing) -->
          <polygon points="74,54 81,52 81,57" fill="#ffffff" filter="url(#glow)" />
          <path d="M81 50 L95 45 L95 62 Z" fill="url(#glow-gradient)" />
        </svg>
      </div>

      <div class="splash-brand">
        <span class="brand-subtitle">SANKARA NIGERIA LIMITED</span>
        <div class="loading-bar">
          <div class="loading-progress"></div>
        </div>
      </div>
    </div>

    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
